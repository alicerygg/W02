
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A character card demonstrating JavaScript objects and methods.">
    <meta name="author" content="Alice Rygg">

    <!-- Social Media Meta Information -->
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Meet my character and explore their stats!">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/character.webp">
    <meta property="og:url" content="">

    <title>Character Card</title>

    <link rel="stylesheet" href="cc.css">
    <script src="cc.js" defer></script>
</head>
<body>
    <header>
        <h1>Character Card</h1>
    </header>

    <main>
        <section class="card">
            <img id="character-image" src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp" alt="Swamp Beast Diplomat">

            <div class="character-info">
                <h2 id="character-name">Character Name</h2>
                <p id="character-class">Class: Unknown</p>
                <p id="character-level">Level: 1</p>
                <p id="character-health">Health: 100</p>

                <div class="buttons">
                    <button id="attack-button">Attack</button>
                    <button id="level-button">Level Up</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>WDD 131 | Character Card</p>
    </footer>
</body>
</html>
