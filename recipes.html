<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of delicious recipes to try at home.">
    <meta name="author" content="Alice">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Recipe Book">
        <meta property="og:description" content="A collection of delicious recipes to try at home.">
        <meta property="og:url" content="YOUR_GITHUB_PAGES_URL">
        <meta property="og:image" content="social-preview-image.png">

        <!-- X Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Recipe Book">
        <meta name="twitter:description" content="A collection of delicious recipes to try at home.">
        <meta name="twitter:image" content="social-preview-image.png">

        <!-- Favicon -->
        <link rel="icon" href="favicon.ico">

        <!-- Apple Touch Icon -->
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="recipes.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="recipe-book.png" alt="Recipe Book Logo">
            <h1>Recipe Book</h1>
        </div>
        <form class="search">
            <input type="text" placeholder="Find a recipe">
            <button type="submit">
                <img src="search.svg" alt="Search">
        </button>
        </form>
    </header>
<main>
    <article class="recipe">
        <img src="apple-crisp.jpg" alt="Freshly baked apple crisp">

        <div class="recipe-content">
            <span class="category">Dessert</span>
            <h2>Apple Crisp</h2>

            <span class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars">
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>

            <p class="description">
                This delicious apple crisp is a perfect dessert
                with tender apples and a crunchy oat topping.
            </p>
        </div>
    </article>
</main>
<footer>
    <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="#"><img src="instagram_icon.svg" alt="Instagram"></a>
        <a href="#"><img src="youtube_icon.svg" alt="YouTube"></a>
        <a href="#"><img src="pinterest_icon.svg" alt="Pinterest"></a>
    </div>

    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
        Recipe icons created by Freepik - Flaticon
    </a>
</footer>
</body>
</html>
